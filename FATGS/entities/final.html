<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Base Timetable Studio</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d2e;
      --border: #26334d;
      --text-main: #f1f5f9;
      --text-muted: #8493a8;
      --accent: #38bdf8;
      --btn-blue: #2563eb;
      --btn-green: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 20px; background: var(--bg-main); color: var(--text-main);
    }
    .container { max-width: 1250px; margin: 0 auto; }
    h1 { margin: 0 0 4px 0; font-size: 20px; }
    .desc { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }

    .panel {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 18px;
    }

    .controls { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    select {
      background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border);
      padding: 7px 10px; border-radius: 6px; font-size: 13px; min-width: 150px; outline: none;
    }
    select:focus { border-color: var(--accent); }

    .btn {
      color: white; border: none; padding: 8px 14px;
      border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-gen { background: var(--btn-blue); margin-left: auto; }
    .btn-save { background: var(--btn-green); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: #0e1626; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }

    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .badge-sub { background: #312e81; color: #c7d2fe; }
    .badge-lab { background: #064e3b; color: #a7f3d0; }

    /* Transposed Grid (Rows = Days, Cols = Time) */
    .tt-table th, .tt-table td { text-align: center; vertical-align: top; padding: 8px; }
    .tt-table th.day-head { width: 110px; background: #111c2e; color: #38bdf8; font-weight: bold; font-size: 13px; }
    .tt-cell-empty { color: #3b485e; background: #0f1624; }
    .tt-cell-lunch { background: #131b2b; color: var(--text-muted); font-weight: 600; vertical-align: middle !important; }
    .tt-cell-booked { background: #1a2f4d; border-color: #2b528a; }
    .code-title { font-weight: 700; color: #60a5fa; }
    .fac-title { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    .room-title { font-size: 11px; color: #34d399; margin-top: 2px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Local Base Timetable Studio</h1>
  <div class="desc">Assign faculties, generate balanced Mon–Fri schedules across all sections, and download locally as JSON.</div>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="yearSelect">Year</label>
        <select id="yearSelect"><option value="">-- Year --</option></select>
      </div>
      <div class="control-group">
        <label for="semSelect">Semester</label>
        <select id="semSelect"><option value="">-- Semester --</option></select>
      </div>
      <div class="control-group">
        <label for="secSelect">Section</label>
        <select id="secSelect"><option value="">-- Section --</option></select>
      </div>
      <button id="generateBtn" class="btn btn-gen">Generate Current Section</button>
      <button id="saveJsonBtn" class="btn btn-save" style="display: none;">Save to JSON</button>
    </div>
  </div>

  <div id="allocCard" class="panel" style="display: none;">
    <h3 style="margin: 0 0 10px 0; font-size: 15px; color: var(--accent);">
      1. Assign Faculties for <span id="sectionLabel"></span>
    </h3>
    <table>
      <thead>
      <tr>
        <th style="width: 80px;">Type</th>
        <th style="width: 100px;">Code</th>
        <th>Course Title</th>
        <th style="width: 60px;">Credits</th>
        <th style="width: 250px;">Faculty</th>
      </tr>
      </thead>
      <tbody id="allocRows"></tbody>
    </table>
  </div>

  <div id="gridCard" class="panel" style="display: none;">
    <h3 style="margin: 0 0 10px 0; font-size: 15px; color: #34d399;">
      2. Generated Timetable (<span id="gridLabel"></span>) — Mon to Fri
    </h3>
    <div style="overflow-x: auto;">
      <table class="tt-table" id="ttTable"></table>
    </div>
  </div>
</div>

<script>
  const FACULTY_ROSTER = [

    'Faculty F', 'Faculty G', 'Faculty H', 'Faculty I', 'Faculty J',
    'Faculty K', 'Faculty L', 'Faculty M', 'Faculty N', 'Faculty O'
  ];

  // Complete Master Sections: Sem 3, Sem 4, Sem 5, Sem 6
  const RAW_SECTIONS = [
    // 2nd Year - Sem 3
    {

      "labs": [
        { "code": "CS-217", "name": "Object Oriented Programming Lab", "credits": 1 },

      "labs": [

        { "code": "CS-218", "name": "Data Structures Lab", "credits": 1 },
        { "code": "CS-219", "name": "Computational Tools and Workshop", "credits": 1 }
      ],
      "subjects": [
        { "code": "MA-219", "name": "Probability and Applied Statistics", "credits": 3 },
        { "code": "CS-212", "name": "Discrete Structures", "credits": 3 },
        { "code": "CS-213", "name": "Object Oriented Programming", "credits": 3 },
        { "code": "CS-214", "name": "Data Structures", "credits": 3 },
        { "code": "CS-215", "name": "Computer Graphics", "credits": 3 },
        { "code": "EC-219", "name": "Digital Electronics", "credits": 2 }
      ]
    },
    // 2nd Year - Sem 4
    {
      "name": "CS2", "year": "2nd Year", "semester": "4th Semester",
      "labs": [
        { "code": "CS-225", "name": "Microprocessor & Interfacing Lab", "credits": 1 },
        { "code": "CS-226", "name": "Operating Systems Lab", "credits": 1 },
        { "code": "CS-227", "name": "Computer Organization & Architecture Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-221", "name": "Microprocessor & Interfacing", "credits": 3 },
        { "code": "CS-222", "name": "Operating Systems", "credits": 3 },
        { "code": "CS-223", "name": "Computer Organization and Architecture", "credits": 3 },
        { "code": "CS-224", "name": "Theory of Computation", "credits": 4 },
        { "code": "SA-201", "name": "LA/CA (NSS/NCC/Prayas etc.)", "credits": 1 }
      ]
    },
    {
      "name": "CD2", "year": "2nd Year", "semester": "4th Semester",
      "labs": [
        { "code": "CS-225", "name": "Microprocessor & Interfacing Lab", "credits": 1 },
        { "code": "CS-226", "name": "Operating Systems Lab", "credits": 1 },
        { "code": "CS-227", "name": "Computer Organization & Architecture Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-221", "name": "Microprocessor & Interfacing", "credits": 3 },
        { "code": "CS-222", "name": "Operating Systems", "credits": 3 },
        { "code": "CS-223", "name": "Computer Organization and Architecture", "credits": 3 },
        { "code": "CS-224", "name": "Theory of Computation", "credits": 4 },
        { "code": "SA-201", "name": "LA/CA (NSS/NCC/Prayas etc.)", "credits": 1 }
      ]
    },
    // 3rd Year - Sem 5
    {
      "name": "CS3", "year": "3rd Year", "semester": "5th Semester",
      "labs": [
        { "code": "CS-315", "name": "Compiler Design Lab", "credits": 1 },
        { "code": "CS-316", "name": "Computer Networks Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-311", "name": "Analysis & Design of Algorithm", "credits": 3 },
        { "code": "CS-312", "name": "Compiler Design", "credits": 3 },
        { "code": "CS-313", "name": "Computer Networks", "credits": 3 },
        { "code": "CS-314", "name": "Artificial Intelligence", "credits": 3 }
      ]
    },
    {
      "name": "CD3", "year": "3rd Year", "semester": "5th Semester",
      "labs": [
        { "code": "CS-315", "name": "Compiler Design Lab", "credits": 1 },
        { "code": "CS-316", "name": "Computer Networks Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-311", "name": "Analysis & Design of Algorithm", "credits": 3 },
        { "code": "CS-312", "name": "Compiler Design", "credits": 3 },
        { "code": "CS-313", "name": "Computer Networks", "credits": 3 },
        { "code": "CS-314", "name": "Artificial Intelligence", "credits": 3 }
      ]
    },
    // 3rd Year - Sem 6
    {
      "name": "CS3", "year": "3rd Year", "semester": "6th Semester",
      "labs": [
        { "code": "CS-324", "name": "Digital Image Processing Lab", "credits": 1 },
        { "code": "CS-325", "name": "Database Management Systems Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-321", "name": "Digital Image Processing", "credits": 3 },
        { "code": "CS-322", "name": "Database Management Systems", "credits": 3 },
        { "code": "CS-323", "name": "Software Engineering", "credits": 2 },
        { "code": "HS-321", "name": "Engineering Economics and Accountancy", "credits": 2 }
      ]
    },
    {
      "name": "CD3", "year": "3rd Year", "semester": "6th Semester",
      "labs": [
        { "code": "CS-324", "name": "Digital Image Processing Lab", "credits": 1 },
        { "code": "CS-325", "name": "Database Management Systems Lab", "credits": 1 }
      ],
      "subjects": [
        { "code": "CS-321", "name": "Digital Image Processing", "credits": 3 },
        { "code": "CS-322", "name": "Database Management Systems", "credits": 3 },
        { "code": "CS-323", "name": "Software Engineering", "credits": 2 },
        { "code": "HS-321", "name": "Engineering Economics and Accountancy", "credits": 2 }
      ]
    }
  ];

  const ROOMS = [
    { "roomNo": "B1", "type": "Class" }, { "roomNo": "B2", "type": "Class" },
    { "roomNo": "B4", "type": "Class" }, { "roomNo": "G5", "type": "Class" },
    { "roomNo": "F4", "type": "Class" }, { "roomNo": "F6", "type": "Class" },
    { "roomNo": "S2", "type": "Class" }, { "roomNo": "CSE-III", "type": "Class" },
    { "roomNo": "LAB B1", "type": "Lab" }, { "roomNo": "LAB B2", "type": "Lab" },
    { "roomNo": "P1", "type": "Lab" }, { "roomNo": "P4", "type": "Lab" }, { "roomNo": "P5", "type": "Lab" }
  ];

  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const INTERVALS = [
    { start: '09:00', end: '10:00', isLunch: false },
    { start: '10:00', end: '11:00', isLunch: false },
    { start: '11:00', end: '12:00', isLunch: false },
    { start: '12:00', end: '13:00', isLunch: false },
    { start: '13:00', end: '14:00', isLunch: true  },
    { start: '14:00', end: '15:00', isLunch: false },
    { start: '15:00', end: '16:00', isLunch: false },
    { start: '16:00', end: '17:00', isLunch: false }
  ];

  const ORDERED_PERIODS = [0, 1, 2, 3, 5, 6, 7];

  const STORE = RAW_SECTIONS.map(s => ({
    ...s,
    subjects: s.subjects.map(sub => ({ ...sub, faculty: null })),
    labs: s.labs.map(lab => ({ ...lab, faculty: null }))
  }));

  let currentSection = null;

  // Global Cross-Section Persistent Trackers
  const PERSISTED_GRIDS = new Map();     // secKey -> 5x8 grid
  const GLOBAL_FAC_BOOKINGS = new Set();  // "facName_day_period"
  const GLOBAL_ROOM_BOOKINGS = new Set(); // "roomNo_day_period"

  const yearSel = document.getElementById('yearSelect');
  const semSel = document.getElementById('semSelect');
  const secSel = document.getElementById('secSelect');
  const allocCard = document.getElementById('allocCard');
  const gridCard = document.getElementById('gridCard');
  const allocRows = document.getElementById('allocRows');
  const sectionLabel = document.getElementById('sectionLabel');
  const gridLabel = document.getElementById('gridLabel');
  const generateBtn = document.getElementById('generateBtn');
  const saveJsonBtn = document.getElementById('saveJsonBtn');
  const ttTable = document.getElementById('ttTable');

  // Populate Year
  [...new Set(STORE.map(s => s.year))].forEach(y => yearSel.innerHTML += `<option value="${y}">${y}</option>`);

  yearSel.addEventListener('change', () => {
    semSel.innerHTML = '<option value="">-- Semester --</option>';
    secSel.innerHTML = '<option value="">-- Section --</option>';
    allocCard.style.display = 'none';
    gridCard.style.display = 'none';
    if (!yearSel.value) return;

    const sems = [...new Set(STORE.filter(s => s.year === yearSel.value).map(s => s.semester))];
    sems.forEach(s => semSel.innerHTML += `<option value="${s}">${s}</option>`);
  });

  semSel.addEventListener('change', () => {
    secSel.innerHTML = '<option value="">-- Section --</option>';
    allocCard.style.display = 'none';
    gridCard.style.display = 'none';
    if (!semSel.value) return;

    STORE.filter(s => s.year === yearSel.value && s.semester === semSel.value)
            .forEach(s => secSel.innerHTML += `<option value="${s.name}">${s.name}</option>`);
  });

  secSel.addEventListener('change', () => {
    if (!secSel.value) {
      allocCard.style.display = 'none';
      gridCard.style.display = 'none';
      return;
    }
    currentSection = STORE.find(s => s.year === yearSel.value && s.semester === semSel.value && s.name === secSel.value);
    renderAllocations();
    updateGridView();
  });

  function renderAllocations() {
    allocCard.style.display = 'block';
    sectionLabel.textContent = `${currentSection.name} (${currentSection.year} - ${currentSection.semester})`;
    allocRows.innerHTML = '';

    const list = [
      ...currentSection.subjects.map(s => ({ ...s, type: 'subject' })),
      ...currentSection.labs.map(l => ({ ...l, type: 'lab' }))
    ];

    list.forEach(item => {
      const tr = document.createElement('tr');
      const pool = item.type === 'lab' ? currentSection.labs : currentSection.subjects;
      const assigned = new Set(pool.filter(i => i.code !== item.code && i.faculty).map(i => i.faculty));
      const freeFac = FACULTY_ROSTER.filter(f => !assigned.has(f) || item.faculty === f);

      let options = '<option value="">-- Select Faculty --</option>';
      freeFac.forEach(f => {
        options += `<option value="${f}" ${item.faculty === f ? 'selected' : ''}>${f}</option>`;
      });

      tr.innerHTML = `
        <td><span class="badge ${item.type === 'lab' ? 'badge-lab' : 'badge-sub'}">${item.type.toUpperCase()}</span></td>
        <td><strong>${item.code}</strong></td>
        <td>${item.name}</td>
        <td>${item.credits}</td>
        <td><select>${options}</select></td>
      `;

      tr.querySelector('select').addEventListener('change', (e) => {
        item.faculty = e.target.value || null;
        const target = pool.find(i => i.code === item.code);
        if (target) target.faculty = item.faculty;
        renderAllocations();
      });
      allocRows.appendChild(tr);
    });
  }

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Strict Global Conflict Checks
  function isSlotAvailable(fac, room, day, period) {
    if (room && GLOBAL_ROOM_BOOKINGS.has(`${room}_${day}_${period}`)) return false;
    if (fac && fac !== '(Unassigned)' && GLOBAL_FAC_BOOKINGS.has(`${fac}_${day}_${period}`)) return false;
    return true;
  }

  function reserveSlot(fac, room, day, period) {
    if (room) GLOBAL_ROOM_BOOKINGS.add(`${room}_${day}_${period}`);
    if (fac && fac !== '(Unassigned)') GLOBAL_FAC_BOOKINGS.add(`${fac}_${day}_${period}`);
  }

  function releaseSectionSlots(grid) {
    if (!grid) return;
    for (let d = 0; d < 5; d++) {
      for (let p = 0; p < 8; p++) {
        const cell = grid[d][p];
        if (cell) {
          if (cell.room) GLOBAL_ROOM_BOOKINGS.delete(`${cell.room}_${d}_${p}`);
          if (cell.faculty && cell.faculty !== '(Unassigned)') {
            GLOBAL_FAC_BOOKINGS.delete(`${cell.faculty}_${d}_${p}`);
          }
        }
      }
    }
  }

  function firstOpenPeriod(grid, day) {
    for (const p of ORDERED_PERIODS) {
      if (!grid[day][p]) return p;
    }
    return null;
  }

  function getDayLoad(grid, day) {
    return grid[day].filter(Boolean).length;
  }

  // Safe fallback to resolve placeholder faculty if left unassigned
  function resolveSafeFaculty(candidateFac, section, type, day, p1, p2 = null) {
    if (candidateFac) {
      const valid = p2 !== null
              ? isSlotAvailable(candidateFac, null, day, p1) && isSlotAvailable(candidateFac, null, day, p2)
              : isSlotAvailable(candidateFac, null, day, p1);
      return valid ? candidateFac : null;
    }

    // Pick any free faculty from roster not already teaching this type in this section
    const pool = type === 'lab' ? section.labs : section.subjects;
    const takenInSec = new Set(pool.map(i => i.faculty).filter(Boolean));
    const available = FACULTY_ROSTER.filter(f => !takenInSec.has(f));

    for (const fac of shuffle(available)) {
      const isFree = p2 !== null
              ? isSlotAvailable(fac, null, day, p1) && isSlotAvailable(fac, null, day, p2)
              : isSlotAvailable(fac, null, day, p1);
      if (isFree) return fac;
    }
    return '(Unassigned)';
  }

  // Generator: locks current section, schedules around other sections
  generateBtn.addEventListener('click', () => {
    if (!currentSection) {
      alert('Select a section first!');
      return;
    }

    const secKey = `${currentSection.name}_${currentSection.year}_${currentSection.semester}`;

    // Free previous allocation if regenerating this section
    if (PERSISTED_GRIDS.has(secKey)) {
      releaseSectionSlots(PERSISTED_GRIDS.get(secKey));
    }

    const classRooms = ROOMS.filter(r => r.type === 'Class');
    const labRooms = ROOMS.filter(r => r.type === 'Lab');
    const LAB_BLOCKS = [[0, 1], [2, 3], [5, 6], [6, 7]];

    const grid = Array.from({ length: 5 }, () => Array.from({ length: 8 }, () => null));

    // 1. Labs (Contiguous 2-Period blocks)
    const shuffledLabs = shuffle(currentSection.labs);
    shuffledLabs.forEach(lab => {
      let placed = false;
      const attempts = [];
      for (let d = 0; d < 5; d++) {
        for (let b = 0; b < LAB_BLOCKS.length; b++) {
          attempts.push({ day: d, block: LAB_BLOCKS[b] });
        }
      }
      const shuffledAttempts = shuffle(attempts);

      for (const { day, block } of shuffledAttempts) {
        const [p1, p2] = block;
        if (grid[day][p1] || grid[day][p2]) continue;

        const effectiveFaculty = resolveSafeFaculty(lab.faculty, currentSection, 'lab', day, p1, p2);
        if (!effectiveFaculty) continue;

        const freeLab = shuffle(labRooms).find(r =>
                isSlotAvailable(effectiveFaculty, r.roomNo, day, p1) &&
                isSlotAvailable(effectiveFaculty, r.roomNo, day, p2)
        );
        if (!freeLab) continue;

        const cellData = { code: lab.code, faculty: effectiveFaculty, room: freeLab.roomNo };
        grid[day][p1] = cellData;
        grid[day][p2] = cellData;

        reserveSlot(effectiveFaculty, freeLab.roomNo, day, p1);
        reserveSlot(effectiveFaculty, freeLab.roomNo, day, p2);
        placed = true;
        break;
      }
    });

    // 2. Theory Subjects (Load balanced across 5 days)
    const expanded = [];
    currentSection.subjects.forEach(sub => {
      for (let i = 0; i < sub.credits; i++) expanded.push(sub);
    });
    const shuffledSubs = shuffle(expanded);

    const sIdx = RAW_SECTIONS.findIndex(s => s.name === currentSection.name && s.year === currentSection.year && s.semester === currentSection.semester);
    const preferredRoom = classRooms[sIdx % classRooms.length].roomNo;

    shuffledSubs.forEach(sub => {
      let placed = false;
      const balancedDays = [0, 1, 2, 3, 4].sort((a, b) => getDayLoad(grid, a) - getDayLoad(grid, b));

      for (const day of balancedDays) {
        const alreadyToday = grid[day].some(c => c && c.code === sub.code);
        if (alreadyToday) continue;

        const p = firstOpenPeriod(grid, day);
        if (p === null) continue;

        const effectiveFaculty = resolveSafeFaculty(sub.faculty, currentSection, 'subject', day, p);
        if (!effectiveFaculty) continue;

        let chosenRoom = isSlotAvailable(effectiveFaculty, preferredRoom, day, p) ? preferredRoom : null;
        if (!chosenRoom) {
          const fallback = shuffle(classRooms).find(r => isSlotAvailable(effectiveFaculty, r.roomNo, day, p));
          if (fallback) chosenRoom = fallback.roomNo;
        }

        if (chosenRoom) {
          grid[day][p] = { code: sub.code, faculty: effectiveFaculty, room: chosenRoom };
          reserveSlot(effectiveFaculty, chosenRoom, day, p);
          placed = true;
          break;
        }
      }

      // Fallback slot
      if (!placed) {
        for (let day = 0; day < 5; day++) {
          const p = firstOpenPeriod(grid, day);
          if (p === null) continue;
          const effectiveFaculty = resolveSafeFaculty(sub.faculty, currentSection, 'subject', day, p);
          if (!effectiveFaculty) continue;

          let chosenRoom = isSlotAvailable(effectiveFaculty, preferredRoom, day, p) ? preferredRoom : null;
          if (!chosenRoom) {
            const fb = classRooms.find(r => isSlotAvailable(effectiveFaculty, r.roomNo, day, p));
            if (fb) chosenRoom = fb.roomNo;
          }

          if (chosenRoom) {
            grid[day][p] = { code: sub.code, faculty: effectiveFaculty, room: chosenRoom };
            reserveSlot(effectiveFaculty, chosenRoom, day, p);
            placed = true;
            break;
          }
        }
      }
    });

    PERSISTED_GRIDS.set(secKey, grid);
    saveJsonBtn.style.display = 'inline-block';
    updateGridView();
  });

  function updateGridView() {
    if (!currentSection) return;
    const secKey = `${currentSection.name}_${currentSection.year}_${currentSection.semester}`;
    const grid = PERSISTED_GRIDS.get(secKey);
    if (!grid) {
      gridCard.style.display = 'none';
      return;
    }

    gridCard.style.display = 'block';
    gridLabel.textContent = `${currentSection.name} - ${currentSection.year} (${currentSection.semester})`;

    let html = '<thead><tr><th class="day-head">Day</th>';
    INTERVALS.forEach(interval => {
      html += `<th>${interval.start} - ${interval.end}</th>`;
    });
    html += '</tr></thead><tbody>';

    DAYS.forEach((dayName, dIdx) => {
      html += `<tr><th class="day-head">${dayName}</th>`;

      INTERVALS.forEach((interval, pIdx) => {
        if (interval.isLunch) {
          html += '<td class="tt-cell-lunch">Lunch</td>';
          return;
        }

        const cell = grid[dIdx][pIdx];
        if (cell) {
          html += `
            <td class="tt-cell-booked">
              <div class="code-title">${cell.code}</div>
              <div class="fac-title">${cell.faculty}</div>
              <div class="room-title">${cell.room}</div>
            </td>`;
        } else {
          html += '<td class="tt-cell-empty">—</td>';
        }
      });

      html += '</tr>';
    });

    html += '</tbody>';
    ttTable.innerHTML = html;
  }

  // Export all scheduled sections into flat JSON format
  saveJsonBtn.addEventListener('click', () => {
    const flatData = [];

    PERSISTED_GRIDS.forEach((grid, secKey) => {
      const [name, year, semester] = secKey.split('_');

      DAYS.forEach((dayName, dIdx) => {
        INTERVALS.forEach((interval, pIdx) => {
          const cell = grid[dIdx][pIdx];
          if (!cell) return;

          flatData.push({
            section: name,
            year: year,
            semester: semester,
            day: dayName,
            start: interval.start,
            end: interval.end,
            subjectCode: cell.code,
            faculty: cell.faculty,
            room: cell.room
          });
        });
      });
    });

    const blob = new Blob([JSON.stringify(flatData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'base_timetable.json';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
